<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM Dashboard – Web Demo</title>
<style>
  :root{
    --side:#532e67; --active:#e48fb1; --bg:#f7f8fc; --card:#fff; --ink:#1f2330; --muted:#5f6577;
    --line:#e6e8f0; --ok:#1e7d4f; --warn:#a15c00; --bad:#b4232c;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Open Sans","Segoe UI",system-ui,Helvetica,Arial,sans-serif;color:var(--ink);background:var(--bg)}
  .note{background:#fff8e1;border-bottom:1px solid #f1e3b3;padding:8px 16px;font-size:13px;color:#5c4b00;text-align:center}
  .app{display:flex;min-height:calc(100vh - 38px)}
  nav{background:var(--side);width:220px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:24px 14px;gap:8px}
  nav .logo{color:#fff;font-size:28px;font-weight:700;margin-bottom:18px;letter-spacing:1px}
  nav button{width:100%;height:48px;border:0;border-radius:8px;background:transparent;color:#fff;font:600 15px inherit;font-family:inherit;cursor:pointer;text-align:left;padding:0 16px}
  nav button:hover{background:rgba(255,255,255,.1)}
  nav button.active{background:var(--active)}
  main{flex:1;padding:28px 32px;min-width:0}
  h1{margin:0;font-size:28px}
  .welcome{color:var(--muted);margin:6px 0 24px;font-size:16px}
  .kpis{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:18px}
  .kpi{background:var(--card);border-radius:12px;padding:20px;box-shadow:0 1px 3px rgba(16,24,40,.08);border-top:4px solid var(--active)}
  .kpi .t{font-weight:600;color:var(--muted);font-size:14px}
  .kpi .v{font-size:36px;font-weight:700;margin-top:8px;color:var(--side)}
  .panel{background:var(--card);border-radius:12px;padding:18px;box-shadow:0 1px 3px rgba(16,24,40,.08);margin-top:22px}
  .planned{background:#f3ecf7;border:1px dashed #b89ac9;color:#4a2a5c;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px}
  .tablewrap{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--muted);font-weight:600;font-size:13px;background:#fafbfe}
  .pill{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600}
  .p-ok{background:#e3f4ea;color:var(--ok)} .p-warn{background:#fff1dd;color:var(--warn)} .p-bad{background:#fde7e8;color:var(--bad)} .p-n{background:#eef0f6;color:var(--muted)}
  .bars{display:grid;gap:10px}
  .bar{display:grid;grid-template-columns:120px 1fr 110px;align-items:center;gap:12px;font-size:14px}
  .bar .track{background:#eef0f6;border-radius:6px;height:22px;overflow:hidden}
  .bar .fill{background:var(--side);height:100%;border-radius:6px}
  .two{display:grid;grid-template-columns:1fr;gap:26px;max-width:820px}
  h2{font-size:17px;margin:0 0 12px}
  footer{font-size:12px;color:var(--muted);margin-top:24px}
  @media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}}
  @media (max-width:640px){
    .app{flex-direction:column}
    nav{width:auto;flex-direction:row;flex-wrap:wrap;justify-content:center;padding:12px}
    nav .logo{width:100%;text-align:center;margin:0 0 4px;font-size:22px}
    nav button{width:auto;height:38px;padding:0 12px;font-size:13px}
    main{padding:18px 16px}
    .kpi .v{font-size:28px}
    .bar{grid-template-columns:90px 1fr 80px}
  }
</style>
</head>
<body>
<div class="note">Web demo of my <b>Power Apps CRM app</b> (canvas app on four SharePoint lists). It recreates the dashboard in the browser with sample data, so anyone can try it without a Microsoft licence.</div>
<div class="app">
  <nav id="nav" aria-label="Main navigation">
    <div class="logo">CRM</div>
    <button data-s="dashboard" class="active">Dashboard</button>
    <button data-s="customers">Customers</button>
    <button data-s="contacts">Contacts</button>
    <button data-s="opportunities">Opportunities</button>
    <button data-s="activities">Activities</button>
    <button data-s="reports">Reports</button>
  </nav>
  <main id="main"></main>
</div>
<script>
(function(){
  // Sample data shaped like the four SharePoint lists used by the Power Apps app.
  const customers=[
    {ID:1,Company:"Nordlicht Energie GmbH",Industry:"Energy",Status:"Active",City:"Bielefeld",Country:"Germany",Email:"info@nordlicht-energie.example",Phone:"+49 521 100200",Rep:"Anna Schmidt"},
    {ID:2,Company:"Weber Logistik AG",Industry:"Logistics",Status:"Active",City:"Dortmund",Country:"Germany",Email:"kontakt@weber-logistik.example",Phone:"+49 231 445566",Rep:"Lukas Weber"},
    {ID:3,Company:"Alpenblick Hotels",Industry:"Hospitality",Status:"Inactive",City:"Munich",Country:"Germany",Email:"office@alpenblick.example",Phone:"+49 89 778899",Rep:"Anna Schmidt"},
    {ID:4,Company:"Rhein Retail KG",Industry:"Retail",Status:"Active",City:"Cologne",Country:"Germany",Email:"service@rhein-retail.example",Phone:"+49 221 334455",Rep:"Mia Fischer"},
    {ID:5,Company:"Lumen Health Clinics",Industry:"Healthcare",Status:"Active",City:"Essen",Country:"Germany",Email:"hello@lumen-health.example",Phone:"+49 201 667788",Rep:"Lukas Weber"},
    {ID:6,Company:"Brightworks Studio",Industry:"Media",Status:"Inactive",City:"Paderborn",Country:"Germany",Email:"team@brightworks.example",Phone:"+49 5251 22334",Rep:"Mia Fischer"}
  ];
  const contacts=[
    {Name:"Julia Brandt",Customer:"Nordlicht Energie GmbH",JobTitle:"Head of Controlling",Email:"j.brandt@nordlicht-energie.example",Phone:"+49 521 100211"},
    {Name:"Markus Klein",Customer:"Weber Logistik AG",JobTitle:"IT Manager",Email:"m.klein@weber-logistik.example",Phone:"+49 231 445570"},
    {Name:"Sofia Rossi",Customer:"Rhein Retail KG",JobTitle:"Purchasing Lead",Email:"s.rossi@rhein-retail.example",Phone:"+49 221 334460"},
    {Name:"David Neumann",Customer:"Lumen Health Clinics",JobTitle:"Operations Director",Email:"d.neumann@lumen-health.example",Phone:"+49 201 667790"},
    {Name:"Elif Kaya",Customer:"Alpenblick Hotels",JobTitle:"General Manager",Email:"e.kaya@alpenblick.example",Phone:"+49 89 778801"}
  ];
  const opportunities=[
    {Title:"Finance dashboard rollout",Customer:"Nordlicht Energie GmbH",Stage:"Proposal",Value:48000,Probability:60,Close:"2026-11-28",Owner:"Anna Schmidt"},
    {Title:"Fleet tracking integration",Customer:"Weber Logistik AG",Stage:"Negotiation",Value:72000,Probability:75,Close:"2026-11-15",Owner:"Lukas Weber"},
    {Title:"Store analytics pilot",Customer:"Rhein Retail KG",Stage:"Qualification",Value:25000,Probability:30,Close:"2027-01-20",Owner:"Mia Fischer"},
    {Title:"Patient booking app",Customer:"Lumen Health Clinics",Stage:"Prospecting",Value:39000,Probability:15,Close:"2027-02-10",Owner:"Lukas Weber"},
    {Title:"Guest feedback portal",Customer:"Alpenblick Hotels",Stage:"Lost",Value:18000,Probability:0,Close:"2026-08-30",Owner:"Anna Schmidt"},
    {Title:"Energy usage reporting",Customer:"Nordlicht Energie GmbH",Stage:"Won",Value:31000,Probability:100,Close:"2026-07-14",Owner:"Anna Schmidt"},
    {Title:"Warehouse KPI board",Customer:"Weber Logistik AG",Stage:"Won",Value:22000,Probability:100,Close:"2026-09-02",Owner:"Lukas Weber"}
  ];
  const activities=[
    {Title:"Kick-off call",Customer:"Nordlicht Energie GmbH",Opportunity:"Finance dashboard rollout",Type:"Call",Due:"2026-10-14",AssignedTo:"Anna Schmidt",Status:"Open"},
    {Title:"Send revised quote",Customer:"Weber Logistik AG",Opportunity:"Fleet tracking integration",Type:"Email",Due:"2026-10-13",AssignedTo:"Lukas Weber",Status:"Open"},
    {Title:"Store visit",Customer:"Rhein Retail KG",Opportunity:"Store analytics pilot",Type:"Meeting",Due:"2026-10-21",AssignedTo:"Mia Fischer",Status:"Open"},
    {Title:"Needs analysis workshop",Customer:"Lumen Health Clinics",Opportunity:"Patient booking app",Type:"Meeting",Due:"2026-10-28",AssignedTo:"Lukas Weber",Status:"Open"},
    {Title:"Project handover",Customer:"Nordlicht Energie GmbH",Opportunity:"Energy usage reporting",Type:"Task",Due:"2026-07-20",AssignedTo:"Anna Schmidt",Status:"Completed"},
    {Title:"Lost-deal review",Customer:"Alpenblick Hotels",Opportunity:"Guest feedback portal",Type:"Task",Due:"2026-09-05",AssignedTo:"Anna Schmidt",Status:"Completed"}
  ];

  const $=s=>document.querySelector(s);
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const eur=n=>n.toLocaleString("de-DE",{style:"currency",currency:"EUR",maximumFractionDigits:0});
  const date=d=>new Date(d+"T00:00:00").toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"});
  const pill=(t,c)=>`<span class="pill ${c}">${esc(t)}</span>`;
  const stagePill=s=>pill(s, s==="Won"?"p-ok":s==="Lost"?"p-bad":"p-warn");
  const PLANNED_R='<div class="planned">Planned screen: in the Power Apps version this sidebar button has no screen yet. The web demo shows what a report built from the Opportunities and Customers lists could look like.</div>';
  const PLANNED='<div class="planned">Planned screen: in the Power Apps version this sidebar button has no screen yet. The web demo shows the SharePoint list behind it.</div>';

  // KPI formulas, same as the Power Apps labels
  const kpi={
    total:()=>customers.length,                                                       // CountRows(Customers)
    active:()=>customers.filter(c=>c.Status==="Active").length,                         // CountRows(Filter(Customers, Status.Value = "Active"))
    openOpps:()=>opportunities.filter(o=>o.Stage!=="Won"&&o.Stage!=="Lost").length,    // ... Stage.Value <> "Won" && Stage.Value <> "Lost"
    openActs:()=>activities.filter(a=>a.Status==="Open").length                         // CountRows(Filter(Activities, Status.Value = "Open"))
  };

  function table(cols, rows){
    return `<div class="tablewrap"><table><thead><tr>${cols.map(c=>`<th>${c[0]}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td>${c[1](r)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  }

  const screens={
    dashboard:()=>`
      <h1>Customer Relationship Management</h1>
      <div class="welcome">Welcome, Demo User</div>
      <div class="kpis">
        <div class="kpi"><div class="t">Total Customers</div><div class="v">${kpi.total()}</div></div>
        <div class="kpi"><div class="t">Active Customers</div><div class="v">${kpi.active()}</div></div>
        <div class="kpi"><div class="t">Open Opportunities</div><div class="v">${kpi.openOpps()}</div></div>
        <div class="kpi"><div class="t">Open Activities</div><div class="v">${kpi.openActs()}</div></div>
      </div>`,
    customers:()=>`<h1>Customers</h1><div class="welcome">${customers.length} customers</div><div class="panel">${PLANNED}${table(
      [["Company",c=>`<b>${esc(c.Company)}</b>`],["Industry",c=>esc(c.Industry)],["Status",c=>pill(c.Status,c.Status==="Active"?"p-ok":"p-n")],
       ["City",c=>esc(c.City)],["Email",c=>esc(c.Email)],["Phone",c=>esc(c.Phone)],["Sales rep",c=>esc(c.Rep)]],customers)}</div>`,
    contacts:()=>`<h1>Contacts</h1><div class="welcome">${contacts.length} contacts</div><div class="panel">${PLANNED}${table(
      [["Name",c=>`<b>${esc(c.Name)}</b>`],["Customer",c=>esc(c.Customer)],["Job title",c=>esc(c.JobTitle)],["Email",c=>esc(c.Email)],["Phone",c=>esc(c.Phone)]],contacts)}</div>`,
    opportunities:()=>`<h1>Opportunities</h1><div class="welcome">${opportunities.length} opportunities</div><div class="panel">${PLANNED}${table(
      [["Opportunity",o=>`<b>${esc(o.Title)}</b>`],["Customer",o=>esc(o.Customer)],["Stage",o=>stagePill(o.Stage)],["Deal value",o=>eur(o.Value)],
       ["Probability",o=>o.Probability+" %"],["Expected close",o=>date(o.Close)],["Owner",o=>esc(o.Owner)]],opportunities)}</div>`,
    activities:()=>`<h1>Activities</h1><div class="welcome">${activities.length} activities</div><div class="panel">${PLANNED}${table(
      [["Activity",a=>`<b>${esc(a.Title)}</b>`],["Customer",a=>esc(a.Customer)],["Opportunity",a=>esc(a.Opportunity)],["Type",a=>esc(a.Type)],
       ["Due",a=>date(a.Due)],["Assigned to",a=>esc(a.AssignedTo)],["Status",a=>pill(a.Status,a.Status==="Open"?"p-warn":"p-ok")]],activities)}</div>`,
    reports:()=>{
      const stages=["Prospecting","Qualification","Proposal","Negotiation","Won","Lost"];
      const sums=stages.map(s=>[s,opportunities.filter(o=>o.Stage===s).reduce((t,o)=>t+o.Value,0)]);
      const max=Math.max(...sums.map(x=>x[1]),1);
      const open=opportunities.filter(o=>o.Stage!=="Won"&&o.Stage!=="Lost");
      const weighted=open.reduce((t,o)=>t+o.Value*o.Probability/100,0);
      const byInd={}; customers.forEach(c=>byInd[c.Industry]=(byInd[c.Industry]||0)+1);
      return `<h1>Reports</h1><div class="welcome">Pipeline overview</div><div class="panel">${PLANNED_R}
        <div class="two">
          <div><h2>Deal value by stage</h2><div class="bars">${sums.map(([s,v])=>`<div class="bar"><span>${s}</span><div class="track"><div class="fill" style="width:${v/max*100}%"></div></div><span>${eur(v)}</span></div>`).join("")}</div></div>
          <div><h2>Key figures</h2>${table([["Metric",r=>r[0]],["Value",r=>`<b>${r[1]}</b>`]],[
            ["Open pipeline",eur(open.reduce((t,o)=>t+o.Value,0))],["Weighted pipeline",eur(Math.round(weighted))],
            ["Won this year",eur(opportunities.filter(o=>o.Stage==="Won").reduce((t,o)=>t+o.Value,0))],
            ["Customers by industry",Object.entries(byInd).map(([k,v])=>`${esc(k)} ${v}`).join(" · ")]])}</div>
        </div></div>`;
    }
  };

  function show(s){
    document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.s===s));
    $("#main").innerHTML=screens[s]()+'<footer>Built by Navya Geethika Namburi · Original app: Microsoft Power Apps + SharePoint · Sample data</footer>';
    window.scrollTo(0,0);
  }
  $("#nav").addEventListener("click",e=>{const b=e.target.closest("button"); if(b) show(b.dataset.s);});
  show("dashboard");
})();
</script>
</body>
</html>
