Screens:
  DashboardScreen:
    Properties:
      Fill: =RGBA(247, 248, 252, 1)
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - conAppLayout:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutDirection: =LayoutDirection.Horizontal
            PaddingBottom: =8
            PaddingLeft: =8
            PaddingRight: =8
            PaddingTop: =8
            Width: '=Parent.Width '
          Children:
            - conSidebar:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(83, 46, 103, 1)
                  Height: =Parent.Height
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =20
                  Width: =220
                Children:
                  - lblCRMLogo:
                      Control: Label@2.5.1
                      Properties:
                        Align: =Align.Center
                        BorderColor: =RGBA(0, 18, 107, 1)
                        Color: =RGBA(255, 255, 255, 1)
                        Font: =Font.'Open Sans'
                        FontWeight: =FontWeight.Semibold
                        Height: =60
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        Size: =28
                        Text: ="CRM"
                  - btnDashboard:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =ColorFade(Self.Fill, -15%)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        Fill: =RGBA(228, 143, 177, 1)
                        Font: =Font.'Open Sans'
                        Height: =48
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =Self.Color
                        Text: ="Dashboard"
                        Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                  - btnCustomers:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =ColorFade(Self.Fill, -15%)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Open Sans'
                        Height: =48
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =Self.Color
                        Text: ="Customers"
                        Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                  - btnContacts:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =ColorFade(Self.Fill, -15%)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Open Sans'
                        Height: =48
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =Self.Color
                        Text: ="Contacts"
                        Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                  - btnOpportunities:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =ColorFade(Self.Fill, -15%)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Open Sans'
                        Height: =48
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =Self.Color
                        Text: ="Opportunities"
                        Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                  - btnActivities:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =ColorFade(Self.Fill, -15%)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Open Sans'
                        Height: =48
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =Self.Color
                        Text: ="Activities"
                        Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
                  - btnReports:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =ColorFade(Self.Fill, -15%)
                        Color: =RGBA(255, 255, 255, 1)
                        DisabledBorderColor: =RGBA(166, 166, 166, 1)
                        Fill: =RGBA(0, 0, 0, 0)
                        Font: =Font.'Open Sans'
                        Height: =48
                        HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
                        HoverColor: =RGBA(255, 255, 255, 1)
                        HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PressedBorderColor: =Self.Fill
                        PressedColor: =Self.Fill
                        PressedFill: =Self.Color
                        Text: ="Reports"
                        Width: =Parent.Width - Parent.PaddingLeft - Parent.PaddingRight
            - conMainDashboard:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  Fill: =RGBA(247, 248, 252, 1)
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =16
                  LayoutMinHeight: =16
                  LayoutMinWidth: =16
                  PaddingBottom: =20
                  PaddingLeft: =24
                  PaddingRight: =24
                  PaddingTop: =20
                Children:
                  - conDashboardHeader:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Height: =100
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        Width: =Parent.Width
                      Children:
                        - lblDashboardTitle:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Color: =RGBA(55, 45, 65, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =Parent.Height
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Size: =24
                              Text: ="Customer Relationship Management"
                              Width: =Parent.Width * 0.65
                        - lblWelcome:
                            Control: Label@2.5.1
                            Properties:
                              BorderColor: =RGBA(0, 18, 107, 1)
                              Font: =Font.'Open Sans'
                              FontWeight: =FontWeight.Semibold
                              Height: =Parent.Height
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              Text: ="Welcome, " & User().FullName
                              Width: =Parent.Width * 0.3
                  - conKPIRow:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Height: =170
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =16
                        LayoutMinWidth: =16
                        PaddingBottom: =8
                        PaddingLeft: =8
                        PaddingRight: =8
                        PaddingTop: =8
                        Width: =Parent.Width
                      Children:
                        - conTotalCustomers:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =18
                              PaddingLeft: =18
                              PaddingRight: =18
                              PaddingTop: =18
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                            Children:
                              - lblTotalCustomersTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Font: =Font.Georgia
                                    FontWeight: =FontWeight.Semibold
                                    Height: =45
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Text: ="Total Customers"
                                    Width: =Parent.Width
                              - lblTotalCustomersValue:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Color: =RGBA(83, 46, 103, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =70
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Size: =28
                                    Text: =CountRows(Customers)
                                    Width: =Parent.Width
                        - conActiveCustomers:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =18
                              PaddingLeft: =18
                              PaddingRight: =18
                              PaddingTop: =18
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              X: =40
                              Y: =40
                            Children:
                              - lblActiveCustomersTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Font: =Font.Georgia
                                    FontWeight: =FontWeight.Semibold
                                    Height: =45
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Text: ="Active Customers"
                                    Width: =Parent.Width
                              - lblActiveCustomersValue:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =70
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Size: =28
                                    Text: |-
                                      =CountRows(
                                          Filter(
                                              Customers,
                                              Status.Value = "Active"
                                          )
                                      )
                                    Width: =Parent.Width
                        - conOpenOpportunities:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =18
                              PaddingLeft: =18
                              PaddingRight: =18
                              PaddingTop: =18
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                              X: =40
                              Y: =40
                            Children:
                              - lblOpenOpportunitiesTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Font: =Font.Georgia
                                    FontWeight: =FontWeight.Semibold
                                    Height: =45
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Text: ="Open Opportunities"
                                    Width: =Parent.Width
                              - lblOpenOpportunitiesValue:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =70
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Size: =28
                                    Text: |-
                                      =CountRows(
                                          Filter(
                                              Opportunities,
                                              Stage.Value <> "Won" &&
                                              Stage.Value <> "Lost"
                                          )
                                      )
                                    Width: =Parent.Width
                        - conActivitiesToday:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              Fill: =RGBA(255, 255, 255, 1)
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutGap: =6
                              LayoutMinHeight: =16
                              LayoutMinWidth: =16
                              PaddingBottom: =18
                              PaddingLeft: =18
                              PaddingRight: =18
                              PaddingTop: =18
                              RadiusBottomLeft: =12
                              RadiusBottomRight: =12
                              RadiusTopLeft: =12
                              RadiusTopRight: =12
                            Children:
                              - lblOpenActivitiesTitle:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Font: =Font.Georgia
                                    FontWeight: =FontWeight.Semibold
                                    Height: =45
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Text: ="Open Activities"
                                    Width: =Parent.Width
                              - lblOpenActivitiesValue:
                                  Control: Label@2.5.1
                                  Properties:
                                    BorderColor: =RGBA(0, 18, 107, 1)
                                    Font: =Font.'Open Sans'
                                    FontWeight: =FontWeight.Bold
                                    Height: =70
                                    LayoutMinHeight: =16
                                    LayoutMinWidth: =16
                                    Size: =28
                                    Text: |-
                                      =CountRows(
                                          Filter(
                                              Activities,
                                              Status.Value = "Open"
                                          )
                                      )
                                    Width: =Parent.Width
